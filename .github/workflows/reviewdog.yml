name: Reviewdog Simple Example
on: pull_request

jobs:
  reviewdog:
    name: Run Reviewdog
    runs-on: ubuntu-latest
    env:
      REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # リポジトリをチェックアウト
      - uses: actions/checkout@v4

      # REVIEWDOG_GITHUB_API_TOKENが正しく設定されているか確認する
      - name: Check REVIEWDOG_GITHUB_API_TOKEN
        run: |
          echo "REVIEWDOG_GITHUB_API_TOKEN: $REVIEWDOG_GITHUB_API_TOKEN"
        continue-on-error: true  # 失敗してもジョブを続行する

      # grepで禁止フレーズを検索（TODO）
      - name: Check for forbidden phrases
        run: |
          grep -r "TODO" . || true
        continue-on-error: true  # grepが何も見つけなくてもジョブを失敗させない

      # reviewdogをセットアップ
      - name: Set up reviewdog
        uses: reviewdog/action-setup@v1

      # reviewdogで解析結果をPRに投稿
      - name: Run reviewdog
        run: |
          # 禁止フレーズチェックの結果をレビューに投稿
          reviewdog -f=diff -reporter=github-pr-check -filter-mode=added
