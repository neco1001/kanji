name: Reviewdog Simple Example
on: pull_request

jobs:
  reviewdog:
    name: Run Reviewdog
    runs-on: ubuntu-latest
    env:
      REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # リポジトリをチェックアウト
      - uses: actions/checkout@v4

      # grepで禁止フレーズを検索し結果を保存
      - name: Check for forbidden phrases
        run: |
          grep -r "TODO" . > reviewdog_output.txt || true

      # grepの出力内容を確認
      - name: Show grep output
        run: |
          echo "Contents of reviewdog_output.txt:"
          cat reviewdog_output.txt

      # reviewdogをセットアップ
      - name: Set up reviewdog
        uses: reviewdog/action-setup@v1

      # reviewdogで解析結果をPRに投稿
      - name: Run reviewdog
        run: |
          cat reviewdog_output.txt | reviewdog -f=diff -reporter=github-pr-check -filter-mode=added
